name: macOS build & test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  WAILS_VERSION: 'v2.15.0'

jobs:
  # ---------------------------------------------------------------------------
  # go vet / go test on both Apple Silicon and Intel, plus the root TUN smoke test
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend (needed by go:embed)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Environment
        run: |
          sw_vers; uname -m; go version
          networksetup -listallnetworkservices || true
          route -n get default || true
          echo "--- reachability of the TUN DNS relay upstream (223.5.5.5) ---"
          dig @223.5.5.5 +time=2 +tries=1 +short example.com || true
          dig @8.8.8.8 +time=2 +tries=1 +short example.com || true

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          KNCLOUD_SYSPROXY_TEST: '1'
        run: |
          set -o pipefail
          go test -v -count=1 -timeout 15m ./... 2>&1 | tee go-test.log

      - name: TUN smoke test (utun + gVisor + route + DNS via privileged helper, sudo)
        run: |
          set -o pipefail
          go test -tags tunsmoke -run TestDarwinTunSmoke -count=1 -v -timeout 5m . 2>&1 | tee tun-smoke.log
          grep -q "TUN-SMOKE PASS" tun-smoke.log

      - name: App-level TUN end-to-end (SimpleConnect on/off, curl https://example.com through utun)
        env:
          KNCLOUD_APP_TUN_E2E: '1'
        run: |
          set -o pipefail
          go test -tags tunsmoke -run TestDarwinAppTunE2E -count=1 -v -timeout 5m . 2>&1 | tee app-tun-e2e.log
          grep -q "APP-TUN-E2E PASS" app-tun-e2e.log

      - name: Verify system state restored
        if: always()
        run: |
          netstat -rn -f inet | head -40
          for s in $(networksetup -listallnetworkservices | tail -n +2 | tr ' ' '_'); do
            svc="${s//_/ }"; echo "== $svc: DNS=$(networksetup -getdnsservers "$svc" | tr '\n' ' ')"
          done
          ifconfig | grep -E '^utun' || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            go-test.log
            tun-smoke.log
            app-tun-e2e.log

  # ---------------------------------------------------------------------------
  # Universal (arm64 + x86_64) .app → ad-hoc sign → smoke → zip + dmg
  # ---------------------------------------------------------------------------
  build:
    name: build (universal .app / .dmg)
    runs-on: macos-latest
    permissions:
      contents: write   # release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Version
        id: ver
        run: |
          APP_VERSION="dev"; PLIST_VERSION="0.0.0"; LABEL="${GITHUB_SHA::7}"
          case "$GITHUB_REF" in refs/tags/v*) APP_VERSION="$GITHUB_REF_NAME"; PLIST_VERSION="${GITHUB_REF_NAME#v}"; LABEL="$GITHUB_REF_NAME" ;; esac
          echo "app=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          jq --arg v "$PLIST_VERSION" '.info.productVersion=$v' wails.json > wails.tmp && mv wails.tmp wails.json
          echo "APP_VERSION=$APP_VERSION PLIST_VERSION=$PLIST_VERSION LABEL=$LABEL"

      - name: wails build (darwin/universal)
        run: wails build -platform darwin/universal -clean -ldflags "-X main.appVersion=${{ steps.ver.outputs.app }}"

      - name: Bundle geo data, ad-hoc codesign, verify
        run: |
          APP=build/bin/KNcloud.app
          cp geo/geoip.dat geo/geosite.dat "$APP/Contents/Resources/"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/KNcloud"
          plutil -lint "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist" | grep -q '"top.kncloud.macos"'
          plutil -p "$APP/Contents/Info.plist" | grep -q '"kncloud"'
          du -sh "$APP"

      - name: Smoke - CLI entry points and embedded Xray core (both slices)
        run: |
          set -o pipefail
          BIN=build/bin/KNcloud.app/Contents/MacOS/KNcloud
          "$BIN" --version | tee smoke.log
          "$BIN" --core-selftest | tee -a smoke.log
          echo "--- x86_64 slice under Rosetta ---" | tee -a smoke.log
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$BIN" --core-selftest | tee -a smoke.log
          else
            echo "Rosetta not available, skipped" | tee -a smoke.log
          fi

      - name: Smoke - GUI lifecycle (launch, system proxy, quit restores proxy)
        run: |
          set -u
          APP="$PWD/build/bin/KNcloud.app"
          CFG="$HOME/Library/Application Support/KNcloud/config.json"
          SVC="$(networksetup -listallnetworkservices | sed -n 2p)"
          log() { echo "$*" | tee -a smoke.log; }
          appPid() { pgrep -f "KNcloud.app/Contents/MacOS/KNcloud" | head -1; }
          quitApp() {
            osascript -e 'tell application id "top.kncloud.macos" to quit' 2>&1 | tee -a smoke.log || true
            for i in $(seq 1 30); do [ -z "$(appPid)" ] && return 0; sleep 0.5; done
            return 1
          }

          log "=== 1st launch (fresh install, via LaunchServices) ==="
          open -n "$APP"
          sleep 15
          PID="$(appPid)"; [ -n "$PID" ] || { log "GUI did not start"; exit 1; }
          log "GUI alive (pid $PID)"
          screencapture -x gui-first-launch.png || true
          ls -la "$HOME/Library/Application Support/KNcloud" | tee -a smoke.log
          log "LaunchAgent:"; cat "$HOME/Library/LaunchAgents/top.kncloud.macos.plist" | tee -a smoke.log
          quitApp && log "quit via AppleEvent OK" || { log "app did not quit via AppleEvent"; exit 1; }

          log "=== 2nd launch with a seeded node (direct mode) ==="
          log "config after 1st run:"; cat "$CFG" | tee -a smoke.log
          jq '.nodes=[{"id":"smoke","name":"smoke-node","protocol":"SOCKS","address":"127.0.0.1","port":1080,"network":"tcp","delay":-1,"active":true,"group":"Custom"}] | .activeNodeID="smoke" | .routingMode="direct"' "$CFG" > cfg.tmp && mv cfg.tmp "$CFG"
          open -n --env KNCLOUD_LOG_FILE="$PWD/gui-app.log" "$APP"
          PID=""
          for i in $(seq 1 40); do
            PID="$(appPid)"
            [ -n "$PID" ] && networksetup -getwebproxy "$SVC" | grep -q "Enabled: Yes" && break
            sleep 0.5
          done
          [ -n "$PID" ] || { log "GUI did not start (2nd)"; cat gui-app.log; exit 1; }
          screencapture -x gui-with-node.png || true
          lsof -nP -iTCP -sTCP:LISTEN -a -p "$PID" | tee -a smoke.log || true
          log "--- app log ---"; cat gui-app.log | tee -a smoke.log || true
          log "--- system proxy while running ($SVC) ---"
          networksetup -getwebproxy "$SVC" | tee -a smoke.log
          networksetup -getsocksfirewallproxy "$SVC" | tee -a smoke.log
          networksetup -getwebproxy "$SVC" | grep -q "Enabled: Yes" || { log "system proxy was not enabled"; exit 1; }
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -x http://127.0.0.1:10809 https://example.com || true)"
          log "curl via app HTTP proxy (direct mode) -> HTTP $CODE"
          [ "$CODE" = "200" ] || { log "curl through the app proxy failed"; exit 1; }
          quitApp && log "quit via AppleEvent OK" || { log "app did not quit"; exit 1; }
          log "--- system proxy after quit ---"
          networksetup -getwebproxy "$SVC" | tee -a smoke.log
          networksetup -getwebproxy "$SVC" | grep -q "Enabled: No" || { log "system proxy NOT restored on quit"; exit 1; }
          log "system proxy restored on quit: OK"
          log "--- app log (full) ---"; cat gui-app.log | tee -a smoke.log || true

      - name: Package .zip and .dmg
        run: |
          LABEL="${{ steps.ver.outputs.label }}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/KNcloud.app "dist/KNcloud-macOS-$LABEL.zip"
          (cd dist && shasum -a 256 "KNcloud-macOS-$LABEL.zip" > "KNcloud-macOS-$LABEL.zip.sha256" && cat "KNcloud-macOS-$LABEL.zip.sha256")
          mkdir -p dmgroot
          ditto build/bin/KNcloud.app dmgroot/KNcloud.app
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "KNcloud" -srcfolder dmgroot -ov -format UDZO "dist/KNcloud-macOS-$LABEL.dmg"
          hdiutil verify "dist/KNcloud-macOS-$LABEL.dmg"
          ls -la dist

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNcloud-macOS-universal
          path: dist/

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-smoke-logs
          path: |
            smoke.log
            gui-*.png
            gui-app.log
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.dmg
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # The shared code must keep compiling (and passing tests) on Windows
  # ---------------------------------------------------------------------------
  windows-check:
    name: windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build frontend
        shell: bash
        run: cd frontend && npm ci && npm run build
      - name: go vet (windows)
        shell: bash
        run: go vet -unsafeptr=false . && go vet -unsafeptr=false -tags taptest .
      - name: go build (windows/amd64, windows/arm64)
        shell: bash
        run: |
          GOARCH=amd64 go build -o kn-amd64.exe .
          GOARCH=arm64 go build -o kn-arm64.exe .
      - name: go test (windows)
        shell: bash
        continue-on-error: true
        run: go test -count=1 -timeout 15m . 2>&1 | tail -60
