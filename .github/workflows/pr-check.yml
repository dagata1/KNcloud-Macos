name: PR check (Windows build)

# Build-only verification for pull requests: same toolchain and Wails build as
# build.yml, without signing or releasing.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build Application with Wails
        shell: bash
        run: wails build -platform windows/amd64 -clean

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KNcloud-WIN-windows-amd64-pr
          path: build/bin/*.exe
